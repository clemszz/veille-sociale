# =============================================================================
#  Veille juridique sociale — AIPALS
#  Ce fichier se modifie directement sur GitHub (icône crayon) : chaque
#  enregistrement relance la veille et met le site à jour en quelques minutes.
# =============================================================================

site:
  titre: "Veille juridique sociale"
  sous_titre: "Service social AIPALS : droit social et protection sociale, mis à jour chaque matin"
  # Adresse publique du site (sert au flux RSS), à compléter après activation de GitHub Pages.
  url: ""
  # Durée de conservation de l'historique.
  conserver_jours: 365

collecte:
  # Au tout premier passage, on remonte ce nombre de jours en arrière...
  premiere_collecte_jours: 45
  # ...puis on ignore les éléments plus anciens que ceci (évite qu'un flux qui
  # republie de vieux articles ne pollue la veille).
  fenetre_jours: 21

ia:
  # Nombre d'éléments envoyés à Gemini par appel, et pause entre deux appels :
  # réglés pour rester sous les limites de l'offre gratuite.
  taille_lot: 4
  pause_entre_appels_s: 8
  max_elements_par_passage: 90
  # Au-delà de ce nombre d'échecs, un élément reste affiché sans résumé IA.
  essais_max: 3

# -----------------------------------------------------------------------------
#  THÈMES ET MOTS-CLÉS
#  Un élément est retenu s'il contient au moins un mot-clé (titre ou extrait).
#  - accents et majuscules ignorés ;  mot* = préfixe (handicap* -> handicapés)
#  - mot-clé ENTIÈREMENT EN MAJUSCULES = sigle, casse respectée (AME ≠ âme)
#  Ne pas renommer les clés (maintien_emploi, ...) : seulement les listes.
# -----------------------------------------------------------------------------
