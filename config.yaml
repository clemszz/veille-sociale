# -----------------------------------------------------------------------------
#  SOURCES
#  type     : rss (flux RSS/Atom) ou html (page liste + sélecteurs CSS)
#  filtrer  : true = ne garder que les éléments qui contiennent un mot-clé ;
#             false = tout garder (source déjà 100 % ciblée)
#  lire_page: true = l'IA lit la page complète (extrait du flux trop court)
#  actif    : false pour désactiver une source sans la supprimer
# -----------------------------------------------------------------------------
sources:
  # --- Sources officielles généralistes ---------------------------------------
  - id: sp-particuliers
    nom: "Service-Public.fr (particuliers)"
    type: rss
    url: https://www.service-public.gouv.fr/abonnements/rss/actu-actualites-particuliers.rss
    site: https://www.service-public.gouv.fr/particuliers/actualites
    lire_page: true

  - id: sp-pro
    nom: "Service-Public.fr (professionnels)"
    type: rss
    url: https://www.service-public.gouv.fr/abonnements/rss/actu-actu-pro.rss
    site: https://entreprendre.service-public.gouv.fr/actualites
    lire_page: true

  - id: jo
    nom: "Journal officiel (Lois et décrets)"
    type: dila
    fonds: JORFSIMPLE
    site: https://www.legifrance.gouv.fr/jorf/jo
    # Archives des N derniers jours relues à chaque passage (rattrape un passage manqué).
    jours: 5
    exclure:
      - portant nomination
      - nomination
      - cessation de fonctions
      - tableau d'avancement
      - liste d'aptitude
      - concours
      - examen professionnel
      - délégation de signature
      - titre professionnel
      - handicap naturel
      - handicaps naturels
      - élection
      - médaille
      - promotion
      - admission à la retraite
      - radiation
      - spécialités pharmaceutiques
      - prises en charge en sus
      - produits et prestations
      - dispositifs médicaux
      - tarification
      - prix de
      - autorisées à exercer
      - L. 165-1
      - L. 162-16
      - L. 162-17
      - avis de recrutement
      - portant extension
      - portant agrément
      - armées

  - id: vie-publique-lois
    nom: "Vie-publique.fr (lois)"
    type: rss
    url: https://www.vie-publique.fr/lois-feeds.xml
    site: https://www.vie-publique.fr/lois

  - id: vie-publique-actu
    nom: "Vie-publique.fr (actualités)"
    type: rss
    url: https://www.vie-publique.fr/actualites-feeds.xml
    site: https://www.vie-publique.fr/en-bref

  # --- Ministères ------------------------------------------------------------
  - id: travail-emploi
    nom: "Ministère du Travail"
    type: rss
    url: https://travail-emploi.gouv.fr/rss.xml
    site: https://travail-emploi.gouv.fr
    lire_page: true

  - id: solidarites
    nom: "Ministère des Solidarités"
    type: rss
    url: https://solidarites.gouv.fr/rss.xml
    site: https://solidarites.gouv.fr
    lire_page: true

  - id: handicap-gouv
    nom: "Handicap.gouv.fr"
    type: rss
    url: https://handicap.gouv.fr/rss.xml
    site: https://handicap.gouv.fr
    lire_page: true

  - id: dreets-occitanie
    nom: "DREETS Occitanie"
    type: rss
    url: https://occitanie.dreets.gouv.fr/spip.php?page=backend
    site: https://occitanie.dreets.gouv.fr

  # --- Organismes de protection sociale ---------------------------------------
  - id: ameli-assure
    nom: "ameli.fr (assurés)"
    type: html
    url: https://www.ameli.fr/assure/actualites
    delai_s: 10          # imposé par le robots.txt d'ameli
    lire_page: true
    selecteurs:
      item: div.wrapper-actualite
      titre: h2.titre-actus
      lien: h2.titre-actus a
      date: p.date-actus

  - id: ameli-medecin
    nom: "ameli.fr (médecins : arrêts de travail, ALD...)"
    type: html
    url: https://www.ameli.fr/medecin/actualites
    delai_s: 10
    lire_page: true
    selecteurs:
      item: div.wrapper-actualite
      titre: h2.titre-actus
      lien: h2.titre-actus a
      date: p.date-actus

  - id: assurance-retraite
