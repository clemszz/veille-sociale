name: Veille quotidienne

on:
  schedule:
    # Tous les jours vers 6 h 30 (heure de Paris en hiver, 7 h 30 en été), plus un
    # créneau de secours en début d'après-midi. GitHub retarde voire saute les
    # tâches planifiées aux heures pile (trop demandées) : d'où ces minutes
    # « impaires ». Un passage en double est sans effet (seules les nouveautés
    # sont traitées).
    - cron: "37 5 * * *"
    - cron: "23 11 * * *"
  # Bouton "Run workflow" dans l'onglet Actions, pour lancer à la main.
  workflow_dispatch:
  # Après une modification de la config, du code, de la page, ou un nouveau
  # relevé du relais local (ameli, voir relais_local.py) : régénère.
  push:
    branches: [main]
    paths: ["config.yaml", "veille/**", "templates/**", "assets/**", ".github/workflows/**", "data/relais/**"]

permissions:
  contents: write   # enregistrer data/ (l'historique) dans le dépôt
  pages: write      # publier le site
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter, résumer et générer le site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -u -m veille

      - name: Enregistrer l'historique dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Veille du $(date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
